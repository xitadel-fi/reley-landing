  <text x="1136" y="562" font-family="'Satoshi', 'Figtree', system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2.4" fill="rgba(212,249,255,0.5)" text-anchor="end">RELEY.XYZ</text>
