  <rect width="1200" height="630" fill="url(#body-radial)"/>
  <rect width="1200" height="630" fill="url(#halo-tr)"/>
  <rect width="1200" height="630" fill="url(#halo-bl)"/>

  <!-- Brand mark: Reley R + dot @ 96px -->
  <g transform="translate(64,64) scale(1.5)">
